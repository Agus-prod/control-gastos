<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Control de Gastos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
async async function deleteLoan(id){
  if(!confirm("¿Borrar este préstamo? También se borrarán sus abonos.")) return;
  await sb.from("loan_payments").delete().eq("loan_id", id);
  await sb.from("transactions").delete().eq("loan_id", id);
  const { error } = await sb.from("loans").delete().eq("id", id);
  if(error){ alert(error.message); return; }
  await loadAll();
}

async async function deleteTx(id){
  if(!confirm("¿Borrar este registro?")) return;
  const { error } = await sb.from("transactions").delete().eq("id", id);
  if(error){ alert(error.message); return; }
  await loadAll();
}

async function deleteLoan(id){
  if(!confirm("¿Borrar este préstamo? También se borrarán sus abonos.")) return;
  const { error } = await sb.from("loans").delete().eq("id", id);
  if(error){ alert(error.message); return; }
  await loadAll();
}
</script><script src="/config.js"></script>
<style>
:root{--bg:#f3f6fb;--card:#fff;--txt:#0f172a;--mut:#64748b;--blue:#2563eb;--blue2:#1e3a8a;--green:#16a34a;--red:#dc2626;--line:#e2e8f0;--soft:#eef4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:var(--txt)}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:480px;margin:0 auto;min-height:100vh;padding:22px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{font-size:25px;line-height:1;margin:0}.brand p{margin:4px 0 0;color:var(--mut);font-size:13px}.chip{border-radius:999px;background:#dcfce7;color:#166534;padding:9px 12px;font-weight:800;font-size:12px}.iconbtn{width:42px;height:42px;border-radius:15px;background:#eef4ff;color:#1d4ed8;font-weight:900}.danger{background:#fee2e2!important;color:#b91c1c!important}.hero{background:linear-gradient(135deg,#172554,#2563eb);color:#fff;border-radius:24px;padding:20px;box-shadow:0 18px 50px rgba(37,99,235,.22);margin-bottom:16px}.hero small{opacity:.8}.hero .money{font-size:34px;font-weight:950;margin:4px 0}.row{display:flex;gap:12px}.card{background:var(--card);border:1px solid rgba(15,23,42,.06);border-radius:22px;padding:16px;box-shadow:0 15px 40px rgba(15,23,42,.07);margin-bottom:14px}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--mut);font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kpi strong{display:block;font-size:22px}.bar{height:12px;background:#e8eefc;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#2563eb);width:0}.btn{border-radius:15px;padding:13px 15px;font-weight:900;background:var(--blue);color:white}.btn.light{background:#eef4ff;color:#1d4ed8}.btn.ghost{background:#fff;border:1px solid var(--line);color:#0f172a}.btn:active,.tab:active{transform:scale(.98)}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;padding:8px 10px 12px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border-top:1px solid var(--line)}.tab{background:transparent;border-radius:16px;padding:8px 4px;color:#64748b;font-size:11px;font-weight:800}.tab.active{background:#eef4ff;color:#1d4ed8}.tab b{display:block;font-size:18px;margin-bottom:2px}.screen{display:none}.screen.active{display:block}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:#fff}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px;border-radius:18px;background:#f8fafc;border:1px solid #e8eef5}.item strong{display:block}.pill{font-size:12px;border-radius:999px;padding:5px 9px;font-weight:900}.income{background:#dcfce7;color:#166534}.expense{background:#fee2e2;color:#991b1b}.loan{border-left:5px solid #2563eb}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:18px;max-height:88vh;overflow:auto}.auth{max-width:430px;margin:10vh auto;padding:18px}.auth .logo{margin:0 auto 14px;width:68px;height:68px;border-radius:20px;font-size:24px}.auth h1{text-align:center;margin:0 0 8px}.auth p{text-align:center;color:var(--mut)}.authbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;font-weight:900}.g{font-weight:950;color:#4285F4}.divider{text-align:center;margin:14px 0;color:#94a3b8}.hide{display:none!important}.empty{text-align:center;color:var(--mut);padding:18px}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap} @media(max-width:390px){.brand h1{font-size:22px}.grid2{grid-template-columns:1fr}.hero .money{font-size:30px}}
</style></head><body><div id="root"></div>
<script>
const cfg=window.APP_CONFIG||{}; const sb=window.supabase?.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY); let session=null, tab='home'; let state={cats:[],tx:[],budgets:[],loans:[],payments:[]}; const $=id=>document.getElementById(id); const L=n=>'L '+Number(n||0).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2}); const monthKey=()=>new Date().toISOString().slice(0,7); const today=()=>new Date().toISOString().slice(0,10); function toast(m){alert(m)}
async function init(){ if(!sb){root.innerHTML='<div class="auth"><h1>Supabase no configurado</h1></div>';return} const {data}=await sb.auth.getSession(); session=data.session; sb.auth.onAuthStateChange((e,s)=>{session=s; render(); if(s) loadAll()}); render(); if(session) await loadAll(); }
function user(){return session?.user} function email(){return user()?.email||''}
function render(){ root.innerHTML = session? appHTML(): authHTML(); bind(); }
function authHTML(){return `<div class="auth"><div class="logo">CG</div><h1>Control de Gastos</h1><p>Inicia sesión o crea tu cuenta para sincronizar tus datos.</p><div class="card"><button class="authbtn" id="google">
<svg width="18" height="18" viewBox="0 0 48 48">
<path fill="#EA4335" d="M24 9.5c3.5 0 6.7 1.2 9.2 3.3l6.8-6.8C35.8 2.3 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/>
<path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-2.8-.4-4H24v8.4h12.7c-.3 2.1-1.7 5.3-4.8 7.4l7.7 6c4.5-4.1 6.9-10.2 6.9-17.8z"/>
<path fill="#34A853" d="M10.5 28.6l-8 6.2C6.3 42.7 14.4 48 24 48c6.2 0 11.5-2 15.3-5.5l-7.7-6c-2.1 1.4-4.8 2.4-7.6 2.4-6.2 0-11.4-4-13.3-9.6z"/>
<path fill="#FBBC05" d="M10.7 19.4c-.5-1.4-.8-2.9-.8-4.4s.3-3 .8-4.4l-8-6.2C1 7.6 0 11.2 0 15s1 7.4 2.7 10.6z"/>
</svg>
 Continuar con Google</button><div class="divider">o</div><div id="nameBox" class="field hide"><label>Nombre</label><input id="regName" placeholder="Tu nombre"></div><div class="field"><label>Correo</label><input id="authEmail" type="email" placeholder="tu correo"></div><div class="field"><label>Contraseña</label><input id="authPass" type="password" placeholder="mínimo 6 caracteres"></div><div id="confirmBox" class="field hide"><label>Confirmar contraseña</label><input id="authConfirm" type="password" placeholder="repite la contraseña"></div><div class="row"><button class="btn" id="login" style="flex:1">Entrar</button><button class="btn light" id="signup" style="flex:1">Crear cuenta</button></div><p class="muted small" id="authHint">Google y correo con Supabase Auth.</p></div></div>`}
function appHTML(){return `<div class="app"><div class="top"><div class="brand"><div class="logo">CG</div><div><h1>Control de<br>Gastos</h1><p>${email()}</p></div></div><div class="row"><span class="chip">☁️ Sincronizado</span><button class="iconbtn" id="theme">🌙</button><button class="iconbtn danger" id="logout">Salir</button></div></div>${screenHTML()}<div class="tabs">${['home:🏠:Inicio','reg:📒:Registros','loans:💳:Préstamos','plan:🎯:Plan','more:⚙️:Más'].map(x=>{let[a,b,c]=x.split(':');return `<button class="tab ${tab==a?'active':''}" data-tab="${a}"><b>${b}</b>${c}</button>`}).join('')}</div></div>${modalHTML()}`}
function screenHTML(){ if(tab==='home')return home(); if(tab==='reg')return registros(); if(tab==='loans')return loans(); if(tab==='plan')return plan(); return more(); }



function catByName(catName){
  return state.cats.find(c => String(c.name||c.nombre||'').toLowerCase() === String(catName||'').toLowerCase());
}
function catIcon(catName){
  const c = catByName(catName);
  return c ? (c.icon || c.icono || '🏷️') : '🏷️';
}

function sums(){ const mk=monthKey(); const tx=state.tx.filter(t=>(t.tx_date||t.fecha||'').slice(0,7)===mk); const inc=tx.filter(t=>(t.type||t.tipo)==='ingreso').reduce((a,t)=>a+Number(t.amount||t.monto||0),0); const gas=tx.filter(t=>(t.type||t.tipo)==='gasto').reduce((a,t)=>a+Number(t.amount||t.monto||0),0); const budget=Number((state.budgets.find(b=>(b.month||b.month_key)===mk)||{}).amount||0); const loanBal=state.loans.filter(l=>(l.status||'activo')!=='pagado').reduce((a,l)=>a+Number(l.current_balance||l.balance||l.saldo_actual||l.principal||0),0); return {inc,gas,budget,disp:budget-gas,used:budget?Math.min(100,gas/budget*100):0,loanBal}; }
function home(){const s=sums();return `<div class="hero"><small>Saldo disponible real</small><div class="money">${L(s.inc-s.gas)}</div><div class="row"><span class="pill income">Ingresos ${L(s.inc)}</span><span class="pill expense">Gastos ${L(s.gas)}</span></div></div><div class="grid2"><div class="card kpi"><span class="muted">Presupuesto</span><strong>${L(s.budget)}</strong></div><div class="card kpi"><span class="muted">Disponible</span><strong>${L(s.disp)}</strong></div></div><div class="card"><h3>Uso del presupuesto</h3><div class="bar"><span style="width:${s.used}%"></span></div><p class="muted">Usado ${s.used.toFixed(0)}%</p></div><div class="grid2"><button class="btn" onclick="openTx('gasto')">➖ Gasto</button><button class="btn" onclick="openTx('ingreso')">➕ Ingreso</button></div><div class="card"><h3>Préstamos pendientes</h3><strong style="font-size:24px">${L(s.loanBal)}</strong><p class="muted">Suma de saldos activos.</p></div>`}
function registros(){
  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h2>Movimientos</h2>
      <button class="btn" onclick="openTx('gasto')">Nuevo</button>
    </div>
  </div>
  <div class="list">
    ${state.tx.length ? state.tx.map(t=>{
      const cat = t.category || t.categoria || 'General';
      const icon = catIcon(cat);
      const tipo = t.type || t.tipo;
      return `<div class="item">
        <div>
          <strong>${t.description || t.descripcion || 'Movimiento'}</strong>
          <span class="muted">${icon} ${cat} · ${t.tx_date || t.fecha || ''}</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="pill ${tipo==='ingreso'?'income':'expense'}">${L(t.amount || t.monto)}</span>
          <button class="btn danger" onclick="deleteTx('${t.id}')">Borrar</button>
        </div>
      </div>`
    }).join('') : '<div class="empty">Sin registros</div>'}
  </div>`;
}
function loans(){const active=state.loans.filter(l=>(l.status||'activo')!=='pagado');return `<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><div><h2>Préstamos</h2><p class="muted">Controla saldos y abonos.</p></div><button class="btn" onclick="openLoan()">Nuevo</button></div></div><div class="grid2"><div class="card kpi"><span class="muted">Total prestado</span><strong>${L(state.loans.reduce((a,l)=>a+Number(l.principal||l.amount||l.monto_total||0),0))}</strong></div><div class="card kpi"><span class="muted">Saldo pendiente</span><strong>${L(active.reduce((a,l)=>a+Number(l.current_balance||l.balance||l.saldo_actual||0),0))}</strong></div></div><div class="list">${state.loans.length?state.loans.map(loanCard).join(''):'<div class="empty">No hay préstamos</div>'}</div>`}
function loanCard(l){
  const bal = Number(l.current_balance || l.balance || l.saldo_actual || 0);
  const total = Number(l.principal || l.amount || l.monto_total || 0);
  const pct = total ? Math.max(0, Math.min(100, 100 - bal / total * 100)) : 0;
  return `<div class="card loan">
    <div class="row" style="justify-content:space-between">
      <div>
        <h3>${l.name || l.nombre || 'Préstamo'}</h3>
        <p class="muted">Saldo ${L(bal)} de ${L(total)}</p>
      </div>
      <span class="pill ${bal<=0?'income':'expense'}">${bal<=0?'Pagado':'Activo'}</span>
    </div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div class="actions" style="margin-top:12px">
      <button class="btn light" onclick="openPay('${l.id}')">Abonar</button>
      <button class="btn ghost" onclick="showPays('${l.id}')">Historial</button>
      <button class="btn danger" onclick="deleteLoan('${l.id}')">Borrar</button>
    </div>
  </div>`;
}
function plan(){const s=sums();return `<div class="card"><h2>Plan mensual</h2><p class="muted">Presupuesto para ${monthKey()}</p><div class="field"><label>Presupuesto mensual</label><input id="budgetAmount" type="number" value="${s.budget||''}" placeholder="Ej. 20000"></div><button class="btn" id="saveBudget">Guardar presupuesto</button></div><div class="grid2"><div class="card kpi"><span class="muted">Gastado</span><strong>${L(s.gas)}</strong></div><div class="card kpi"><span class="muted">Disponible</span><strong>${L(s.disp)}</strong></div></div><div class="card"><h3>Progreso</h3><div class="bar"><span style="width:${s.used}%"></span></div><p class="muted">${s.used<70?'Vas bien':s.used<100?'Cuidado':'Excedido'} · ${s.used.toFixed(0)}%</p></div>`}
function more(){return `<div class="card"><h2>Más opciones</h2><p class="muted">Configuración y herramientas.</p><div class="list"><button class="btn light" onclick="openCat()">🏷️ Agregar categoría</button><button class="btn light" onclick="seedCats()">✨ Crear categorías básicas</button><button class="btn danger" onclick="logout()">🚪 Cerrar sesión</button></div><p class="muted small">Los datos se separan por usuario con RLS en Supabase.</p></div><div class="card"><h3>Categorías</h3><div class="list">${state.cats.map(c=>`<div class="item"><span>${c.icon||c.icono||'🏷️'} ${c.name||c.nombre}</span><span class="muted">${c.type||'gasto'}</span></div>`).join('')||'<div class="empty">Sin categorías</div>'}</div></div>`}
function modalHTML(){return `<div class="modal" id="modal"><div class="sheet"><div id="modalBody"></div></div></div>`}
function bind(){ document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()}); if($('logout'))$('logout').onclick=logout; if($('google'))$('google').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}}); if($('login'))$('login').onclick=login; if($('signup'))$('signup').onclick=signupFlow; if($('saveBudget'))$('saveBudget').onclick=saveBudget; }
let signupMode=false; async function login(){const em=$('authEmail').value, pw=$('authPass').value; const {error}=await sb.auth.signInWithPassword({email:em,password:pw}); if(error)toast(error.message)} async function signupFlow(){ if(!signupMode){signupMode=true;$('nameBox').classList.remove('hide');$('confirmBox').classList.remove('hide');$('authHint').textContent='Completa tus datos y presiona Crear cuenta otra vez.';return} const nombre=$('regName').value.trim(), em=$('authEmail').value.trim(), pw=$('authPass').value, cf=$('authConfirm').value; if(!nombre||!em||!pw)return toast('Completa nombre, correo y contraseña'); if(pw!==cf)return toast('Las contraseñas no coinciden'); const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{nombre}}}); if(error)return toast(error.message); if(data.user) await sb.from('profiles').upsert({id:data.user.id,nombre,email:em}); toast('Cuenta creada. Ya puedes entrar.'); }
async function logout(){ await sb.auth.signOut(); localStorage.clear(); sessionStorage.clear(); location.href='/?logout='+Date.now(); }
async function loadAll(){ const uid=user().id; const [cats,tx,bud,loans,pay]=await Promise.all([sb.from('categories').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('transactions').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('budgets').select('*').eq('user_id',uid),sb.from('loans').select('*').eq('user_id',uid).order('created_at',{ascending:false}),sb.from('loan_payments').select('*').eq('user_id',uid).order('created_at',{ascending:false})]); for(const r of [cats,tx,bud,loans,pay]) if(r.error) console.warn(r.error); state={cats:cats.data||[],tx:tx.data||[],budgets:bud.data||[],loans:loans.data||[],payments:pay.data||[]}; render(); }
function closeModal(){ $('modal').classList.remove('show'); }
function openTx(type){
  const cats = state.cats.filter(c => (c.type || 'gasto') === type || !c.type);
  $('modalBody').innerHTML = `<h2>${type==='ingreso'?'Nuevo ingreso':'Nuevo gasto'}</h2>
    <div class="field"><label>Descripción</label><input id="txDesc" placeholder="Ej. supermercado, salario..."></div>
    <div class="field"><label>Monto</label><input id="txAmount" type="number"></div>
    <div class="field"><label>Categoría</label>
      <select id="txCat">
        ${cats.map(c=>{
          const name = c.name || c.nombre || 'General';
          const icon = c.icon || c.icono || '🏷️';
          return `<option value="${name}">${icon} ${name}</option>`;
        }).join('')}
        <option value="General">🏷️ General</option>
      </select>
    </div>
    <div class="field"><label>Fecha</label><input id="txDate" type="date" value="${today()}"></div>
    <div class="row">
      <button class="btn" onclick="saveTx('${type}')">Guardar</button>
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
    </div>`;
  $('modal').classList.add('show');
}
async function saveTx(type){const uid=user().id, amount=Number($('txAmount').value||0); if(!amount)return toast('Ingresa monto'); const row={user_id:uid,type,tipo:type,description:$('txDesc').value,descripcion:$('txDesc').value,amount,monto:amount,category:$('txCat').value,categoria:$('txCat').value,tx_date:$('txDate').value,fecha:$('txDate').value}; const {error}=await sb.from('transactions').insert(row); if(error)return toast(error.message); closeModal(); await loadAll(); }
function openCat(){ $('modalBody').innerHTML=`<h2>Nueva categoría</h2><div class="field"><label>Nombre</label><input id="catName"></div><div class="field"><label>Icono</label><input id="catIcon" value="🏷️"></div><div class="field"><label>Tipo</label><select id="catType"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select></div><div class="row"><button class="btn" onclick="saveCat()">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`; $('modal').classList.add('show'); }
async function saveCat(){const uid=user().id, name=$('catName').value.trim(); if(!name)return toast('Nombre requerido'); const icon=$('catIcon').value||'🏷️', type=$('catType').value; const {error}=await sb.from('categories').insert({user_id:uid,name,nombre:name,icon,icono:icon,type}); if(error)return toast(error.message); closeModal(); await loadAll();}
async function seedCats(){const base=[['Supermercado','🛒'],['Combustible','⛽'],['Alquiler','🏠'],['Electricidad','💡'],['Internet','🌐'],['Pañales','👶'],['Fórmula / leche','🍼'],['Préstamos','💳'],['Salario','💰'],['Ventas','🛍️']]; for(const [name,icon] of base){await sb.from('categories').insert({user_id:user().id,name,nombre:name,icon,icono:icon,type:name==='Salario'||name==='Ventas'?'ingreso':'gasto'});} await loadAll();}
async function saveBudget(){const uid=user().id, amount=Number($('budgetAmount').value||0), month=monthKey(); const existing=state.budgets.find(b=>(b.month||b.month_key)===month); const row={user_id:uid,month,month_key:month,amount,monto:amount}; const q=existing? sb.from('budgets').update(row).eq('id',existing.id) : sb.from('budgets').insert(row); const {error}=await q; if(error)return toast(error.message); toast('Presupuesto guardado'); await loadAll();}
function openLoan(){ $('modalBody').innerHTML=`<h2>Nuevo préstamo</h2><div class="field"><label>Nombre</label><input id="loanName" placeholder="Ej. Luis, Banco, tarjeta..."></div><div class="field"><label>Monto principal</label><input id="loanPrincipal" type="number"></div><div class="field"><label>Interés mensual opcional</label><input id="loanInterest" type="number" value="0"></div><div class="field"><label>Fecha</label><input id="loanDate" type="date" value="${today()}"></div><div class="field"><label>Nota</label><textarea id="loanNote"></textarea></div><div class="row"><button class="btn" onclick="saveLoan()">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`; $('modal').classList.add('show'); }
async function saveLoan(){const uid=user().id, name=$('loanName').value.trim(), principal=Number($('loanPrincipal').value||0), interest=Number($('loanInterest').value||0); if(!name||!principal)return toast('Nombre y monto requeridos'); const row={user_id:uid,name,nombre:name,principal,amount:principal,total_amount:principal,monto_total:principal,balance:principal,current_balance:principal,saldo_actual:principal,interest,interest_rate:interest,start_date:$('loanDate').value,loan_date:$('loanDate').value,note:$('loanNote').value,notes:$('loanNote').value,status:'activo'}; const {error}=await sb.from('loans').insert(row); if(error)return toast(error.message); closeModal(); await loadAll();}
function openPay(id){const l=state.loans.find(x=>x.id===id);$('modalBody').innerHTML=`<h2>Abonar préstamo</h2><p class="muted">${l.name||l.nombre}</p><div class="field"><label>Monto</label><input id="payAmount" type="number"></div><div class="field"><label>Fecha</label><input id="payDate" type="date" value="${today()}"></div><div class="field"><label>Nota</label><input id="payNote"></div><div class="row"><button class="btn" onclick="savePay('${id}')">Abonar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`;$('modal').classList.add('show')}
async function savePay(id){const l=state.loans.find(x=>x.id===id), amount=Number($('payAmount').value||0); if(!amount)return toast('Ingresa monto'); const uid=user().id, date=$('payDate').value, note=$('payNote').value; let bal=Math.max(0,Number(l.current_balance||l.balance||l.saldo_actual||0)-amount); let {error}=await sb.from('loan_payments').insert({loan_id:id,user_id:uid,amount,monto:amount,payment_date:date,fecha:date,note,notes:note}); if(error)return toast(error.message); await sb.from('loans').update({current_balance:bal,balance:bal,saldo_actual:bal,status:bal<=0?'pagado':'activo'}).eq('id',id); await sb.from('transactions').insert({user_id:uid,type:'gasto',tipo:'gasto',description:'Abono préstamo: '+(l.name||l.nombre),descripcion:'Abono préstamo: '+(l.name||l.nombre),amount,monto:amount,category:'Préstamos',categoria:'Préstamos',tx_date:date,fecha:date}); closeModal(); await loadAll();}
function showPays(id){const pays=state.payments.filter(p=>p.loan_id===id);$('modalBody').innerHTML=`<h2>Historial de abonos</h2><div class="list">${pays.map(p=>`<div class="item"><span>${p.payment_date||p.fecha}</span><strong>${L(p.amount||p.monto)}</strong></div>`).join('')||'<div class="empty">Sin abonos</div>'}</div><button class="btn ghost" onclick="closeModal()">Cerrar</button>`;$('modal').classList.add('show')}
init();
</script></body></html>
